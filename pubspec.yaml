name: todo_app
description: "Recurring tasks tracker with analytics."
publish_to: "none"

version: 2.0.1+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  flutter_lucide: ^1.33.0
  path: ^1.9.0
  fl_chart: ^0.70.2
  go_router: ^15.1.2
  uuid: ^4.5.1
  intl: ^0.20.2
  table_calendar: ^3.2.0
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  fleather: ^1.27.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  supabase_flutter: ^2.17.2
  home_widget: ^0.9.3
  connectivity_plus: ^7.3.2
  ota_update: ^7.1.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.34.1+1
  flutter_launcher_icons: ^0.14.4

# Launcher icons for every platform, regenerated with
# `dart run flutter_launcher_icons` after any change under assets/branding.
# The branding images are build-time sources, not runtime assets — they are
# deliberately not listed under `flutter: assets:`.
flutter_launcher_icons:
  # Full bleed (the badge over a blurred copy of itself) everywhere the icon is
  # masked by the platform or must not carry alpha — iOS, macOS, Windows and the
  # web's maskable icons; Android legacy gets the badge with its own corners.
  image_path: "assets/branding/app_icon_full_bleed.png"
  android: true
  image_path_android: "assets/branding/app_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "assets/branding/app_icon_background.png"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  # Android 13+ "themed icon": one colour, tinted by the system.
  adaptive_icon_monochrome: "assets/branding/app_icon_monochrome.png"
  # The badge already sits at 82% inside the foreground image, which is the
  # safe zone Android guarantees; the plugin's own 16% inset would shrink it
  # twice over.
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/branding/app_icon_full_bleed.png"
    background_color: "#F6F8FB"
    theme_color: "#5B6DCB"
  macos:
    generate: true
  windows:
    generate: true
    icon_size: 256

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Onest, the app's typeface (design "Иней", docs/design-handoff/DESIGN.md).
  # Google Fonts ships it only as a variable font; these are static instances
  # cut from it with `fonttools varLib.instancer` at the four weights the design
  # uses. Anything else resolves to the nearest one declared. There is no
  # italic Onest at all. `OFL.txt` ships beside them because the licence
  # requires it.
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Regular.ttf
          weight: 400
        - asset: assets/fonts/Onest-Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
